name: Go verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Unit and integration tests
        run: go test ./...
      - name: Linux race detector
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Static analysis
        run: go vet ./...
      - name: Frontend path contract tests
        run: node --test web/paths.test.mjs
      - name: Local-process smoke (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/smoke-local.sh
      - name: Local-process smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-local.ps1
      - name: Local-process smoke (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\smoke-local-winps51.ps1
